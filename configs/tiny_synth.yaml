# Synthetic probes, ~4.3M params. T4-friendly; sized for ~10-20 min per run so
# a Colab disconnect costs little (SPEC.md section 1).
model:
  d_model: 256
  n_layers: 4
  n_heads: 4
  n_kv_heads: 4          # MHA at this width; GQA buys nothing here
  ffn_mult: 2.6667       # SwiGLU 8/3, param-matched to a 4x GELU FFN
  vocab_size: 64         # synthetic alphabet, not natural language
  max_seq_len: 512
  window: 64             # W in Eq. 9
  prefiller_pattern: SLSL
  decoder_pattern: SSSS
  sharing: shared
  rope: true
  rope_theta: 10000.0
  norm_eps: 1.0e-6
  logit_cap: 15.0        # Eq. 4
  tie_embeddings: true
  attn_impl: sdpa

data:
  kind: synthetic
  task: needle
  seq_len: 512
  # Spans W/8 up to 6W, so probe accuracy has a real distance axis to slope over.
  distances: [8, 16, 32, 48, 64, 96, 128, 192, 256, 384]
  n_keys: 16
  n_values: 16
  n_filler: 16

loss:
  lam: 0.0
  consistency: none
  influence:
    estimator: saliency
    horizon_H: 64
    refresh_every: 50
    ema_decay: 0.9
    detach_local: true

optim:
  lr: 3.0e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup: 200
  schedule: cosine
  grad_clip: 1.0
  total_steps: 4000
  global_tokens_per_step: 65536   # 128 seqs x 512 tokens
  micro_batch: null               # trainer resolves from VRAM
  precision: auto
  compile: false

run:
  name: tiny_synth
  seed: 0
  out_dir: results
  drive_dir: null
  ckpt_every: 250
  log_every: 10
  eval_every: 500
  heartbeat_secs: 60
  wandb: false
