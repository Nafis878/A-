# FineWeb-Edu LM, ~27.8M non-embedding params. T4 ok; sized for ~90 min per run.
# Secondary confirmation only -- the headline domain is synthetic (SPEC.md s.1).
model:
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 4          # GQA 2:1, keeps the recurrent injection affordable
  ffn_mult: 2.6667
  vocab_size: 16384      # 16k BPE keeps the embedding table small at this scale
  max_seq_len: 1024
  window: 256
  prefiller_pattern: SLSL
  decoder_pattern: SSSS
  sharing: shared
  rope: true
  rope_theta: 10000.0
  norm_eps: 1.0e-6
  logit_cap: 15.0
  tie_embeddings: true
  attn_impl: sdpa

data:
  kind: lm
  seq_len: 1024
  task: null
  shard_dir: /content/drive/MyDrive/rwc/data/fineweb16k
  tokenizer_path: /content/drive/MyDrive/rwc/data/fineweb16k/tokenizer.json
  val_tokens: 2000000

loss:
  lam: 0.0
  consistency: none

optim:
  lr: 1.5e-3
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup: 500
  schedule: cosine
  grad_clip: 1.0
  total_steps: 12000
  global_tokens_per_step: 262144  # 256 seqs x 1024 tokens
  micro_batch: null
  precision: auto
  compile: false

run:
  name: small_lm
  seed: 0
  out_dir: results
  drive_dir: /content/drive/MyDrive/rwc
  ckpt_every: 250
  log_every: 10
  eval_every: 1000
  heartbeat_secs: 60
  wandb: false
